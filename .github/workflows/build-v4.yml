# 通信概预算 v4.0（Avalonia UI + .NET 8）：跨平台构建、测试与 DMG 发布
# 触发方式：
#   - push 到开发分支 / tag（v*）：跑测试，tag 时发布 Release（含 DMG）
#   - PR：跑测试
#   - 手动触发：可选 create_release=true，发布预发布版 DMG

name: Build v4 Avalonia

on:
  push:
    branches: [v4-avalonia, main, v4-build-test, v4-build-test-latest, "v4-build-test*"]
    tags: ["v*"]
  pull_request:
    branches: [v4-avalonia, main]
  workflow_dispatch:
    inputs:
      create_release:
        description: "创建 GitHub Release 并附 DMG"
        type: boolean
        default: false
        required: false

jobs:
  test-cross-platform:
    name: Cross-platform tests (Core / Batch / Export / Library / App)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Core
        run: dotnet restore src/TxBudget.Core/TxBudget.Core.csproj

      - name: Restore Batch
        run: dotnet restore src/TxBudget.Batch/TxBudget.Batch.csproj

      - name: Restore Export
        run: dotnet restore src/TxBudget.Export/TxBudget.Export.csproj

      - name: Restore Library
        run: dotnet restore src/TxBudget.Library/TxBudget.Library.csproj

      - name: Restore Avalonia App
        run: dotnet restore src/TxBudget.App/TxBudget.App.csproj

      - name: Restore App Tests
        run: dotnet restore tests/TxBudget.App.Tests/TxBudget.App.Tests.csproj

      - name: Build Core
        run: dotnet build src/TxBudget.Core/TxBudget.Core.csproj -c Release --no-restore -v minimal

      - name: Build Batch
        run: dotnet build src/TxBudget.Batch/TxBudget.Batch.csproj -c Release --no-restore -v minimal

      - name: Build Export
        run: dotnet build src/TxBudget.Export/TxBudget.Export.csproj -c Release --no-restore -v minimal

      - name: Build Library
        run: dotnet build src/TxBudget.Library/TxBudget.Library.csproj -c Release --no-restore -v minimal

      - name: Build Avalonia App
        run: dotnet build src/TxBudget.App/TxBudget.App.csproj -c Release --no-restore -v minimal

      - name: Build App Tests
        run: dotnet build tests/TxBudget.App.Tests/TxBudget.App.Tests.csproj -c Release --no-restore -v minimal

      - name: Test Core (oracle 对拍)
        run: dotnet test tests/TxBudget.Core.Tests/TxBudget.Core.Tests.csproj -c Release --no-build --nologo -v normal

      - name: Test Batch
        run: dotnet test tests/TxBudget.Batch.Tests/TxBudget.Batch.Tests.csproj -c Release --no-build --nologo -v normal

      - name: Test Export
        run: dotnet test tests/TxBudget.Export.Tests/TxBudget.Export.Tests.csproj -c Release --no-build --nologo -v normal

      - name: Test Library
        run: dotnet test tests/TxBudget.Library.Tests/TxBudget.Library.Tests.csproj -c Release --no-build --nologo -v normal

      - name: Test App (smoke)
        run: dotnet test tests/TxBudget.App.Tests/TxBudget.App.Tests.csproj -c Release --no-build --nologo -v normal

  build-macos-app:
    name: macOS unsigned .app (osx-arm64)
    runs-on: macos-latest
    needs: test-cross-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Core
        run: dotnet restore src/TxBudget.Core/TxBudget.Core.csproj -r osx-arm64

      - name: Build Core (osx-arm64)
        run: dotnet build src/TxBudget.Core/TxBudget.Core.csproj -c Release --no-restore -r osx-arm64 --self-contained false -v minimal

      - name: Restore Avalonia App
        run: dotnet restore src/TxBudget.App/TxBudget.App.csproj
      - name: Publish Avalonia App (osx-arm64)
        # 关闭裁剪：Avalonia 11 的 XAML 反射绑定在 PublishTrimmed=true 下不稳定，
        # PublishSingleFile 启用后默认开启裁剪，会导致 macOS 发布版界面绑定失败（ToString fallback）。
        run: dotnet publish src/TxBudget.App/TxBudget.App.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o ./publish/osx-arm64
      - name: Package .app
        run: |
          mkdir -p ./publish/TxBudget.app/Contents/MacOS
          cp -R ./publish/osx-arm64/* ./publish/TxBudget.app/Contents/MacOS/
          chmod +x ./publish/TxBudget.app/Contents/MacOS/TxBudget.App
          echo '<?xml version="1.0" encoding="UTF-8"?>' > ./publish/TxBudget.app/Contents/Info.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> ./publish/TxBudget.app/Contents/Info.plist
          echo '<plist version="1.0"><dict>' >> ./publish/TxBudget.app/Contents/Info.plist
          echo '<key>CFBundleExecutable</key><string>TxBudget.App</string>' >> ./publish/TxBudget.app/Contents/Info.plist
          echo '<key>CFBundleIdentifier</key><string>com.txbudget.app</string>' >> ./publish/TxBudget.app/Contents/Info.plist
          echo '<key>CFBundleName</key><string>TxBudget</string>' >> ./publish/TxBudget.app/Contents/Info.plist
          echo '<key>CFBundleDisplayName</key><string>TxBudget</string>' >> ./publish/TxBudget.app/Contents/Info.plist
          echo '<key>CFBundlePackageType</key><string>APPL</string>' >> ./publish/TxBudget.app/Contents/Info.plist
          echo '<key>CFBundleVersion</key><string>4.0.0</string>' >> ./publish/TxBudget.app/Contents/Info.plist
          echo '<key>CFBundleShortVersionString</key><string>4.0.0</string>' >> ./publish/TxBudget.app/Contents/Info.plist
          echo '<key>LSMinimumSystemVersion</key><string>11.0</string>' >> ./publish/TxBudget.app/Contents/Info.plist
          echo '<key>NSHighResolutionCapable</key><true/>' >> ./publish/TxBudget.app/Contents/Info.plist
          echo '</dict></plist>' >> ./publish/TxBudget.app/Contents/Info.plist
          plutil -lint ./publish/TxBudget.app/Contents/Info.plist
      - name: Create DMG
        run: |
          hdiutil create -volname "TxBudget" \
            -srcfolder ./publish/TxBudget.app \
            -ov -format UDZO \
            ./publish/TxBudget-macOS-arm64.dmg
          hdiutil verify ./publish/TxBudget-macOS-arm64.dmg
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TxBudget-macOS-arm64
          path: ./publish/TxBudget-macOS-arm64.dmg

  release-macos:
    name: GitHub Release (attach DMG)
    # tag 推送（v*）或手动勾选 create_release 时发布
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    needs: [test-cross-platform, build-macos-app]
    permissions:
      contents: write
    steps:
      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: TxBudget-macOS-arm64
          path: ./dist

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          TITLE="通信概预算 ${VERSION}（macOS Apple Silicon）"
          NOTES=$(cat <<'EOF'
          ## 下载
          - Apple Silicon（M1/M2/M3/M4）：`TxBudget-macOS-arm64.dmg`

          ## 安装
          1. 打开 DMG，把 **TxBudget** 拖入「应用程序」
          2. 首次打开：在「系统设置 → 隐私与安全性」点击 **仍要打开**（未签名应用）
          3. 如提示已损坏，在终端执行：
             `xattr -cr /Applications/TxBudget.app`

          ## 包含
          - 451 号文概预算计算引擎（Oracle 对拍验证）
          - 表一~表五 Excel 导出
          - macOS arm64 自包含运行时（无需安装 .NET）
          EOF
          )
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION 已存在，追加资产"
            gh release upload "$VERSION" ./dist/TxBudget-macOS-arm64.dmg --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" ./dist/TxBudget-macOS-arm64.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

  build-windows:
    name: Windows Avalonia compile check
    runs-on: windows-latest
    needs: test-cross-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TxBudget.sln

      - name: Build Workbench
        run: dotnet build src/TxBudget.App.Workbench/TxBudget.App.Workbench.csproj -c Release --no-restore -v minimal

      - name: Build Avalonia App
        run: dotnet build src/TxBudget.App/TxBudget.App.csproj -c Release --no-restore -v minimal

      - name: Verify App.exe exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/TxBudget.App/bin/Release/net8.0/TxBudget.App.exe | Select-Object -First 1
          if (-not $exe) { throw "TxBudget.App.exe 未产出" }
          Write-Output "Avalonia 编译产物: $($exe.FullName) $($exe.Length) bytes"
