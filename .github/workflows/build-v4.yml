  build-windows:
    name: Windows WPF compile check (legacy, pending Avalonia)
    runs-on: windows-latest
    needs: test-cross-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TxBudget.sln

      - name: Build Workbench
        run: dotnet build src/TxBudget.App.Workbench/TxBudget.App.Workbench.csproj -c Release --no-restore -v minimal

      - name: Build WPF App
        run: dotnet build src/TxBudget.App/TxBudget.App.csproj -c Release --no-restore -v minimal

      - name: Verify App.exe exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/TxBudget.App/bin/Release/net8.0-windows/TxBudget.App.exe | Select-Object -First 1
          if (-not $exe) { throw "TxBudget.App.exe 未产出" }
          Write-Output "WPF 编译产物: $($exe.FullName) $($exe.Length) bytes"
