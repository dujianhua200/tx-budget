# 通信概预算：Windows 构建（只出 x64 NSIS 安装包 .exe）
#
# 触发方式：
#   1. 推 tag：git push origin v1.0.1（与 macOS 构建同时跑）
#   2. 手动：Actions -> Build Windows -> Run workflow，填 tag（默认 v1.0.0）
#
# 产物：x64 NSIS .exe，上传到同名 Release（上传前只清该 Release 里的旧 .exe，不动 macOS 的 .dmg）。

name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（须已存在）"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build app
        run: npx electron-builder --win --x64 --publish never

      - name: List artifacts
        run: Get-ChildItem dist-mac/

      - name: Verify package
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist-mac/*.exe | Select-Object -First 1
          if (-not $exe) { throw "未找到 exe 产物" }
          if ($exe.Length -lt 10MB) { throw "exe 过小: $($exe.Length) bytes" }
          Write-Output "包验证通过: $($exe.Name) $($exe.Length) bytes"

      - name: Upload to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view $env:TAG --json name 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create $env:TAG --title $env:TAG --notes "通信概预算 $env:TAG，见仓库 README" 2>$null }
          # 只清旧 .exe，不动 macOS 的 .dmg
          $ids = gh release view $env:TAG --json assets --jq '.assets[] | select(.name | endswith(".exe")) | .id'
          foreach ($id in $ids) { gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$id" }
          gh release upload $env:TAG dist-mac/*.exe --clobber

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: win-x64-${{ github.event.inputs.tag || github.ref_name }}
          path: dist-mac/*.exe
          if-no-files-found: error
