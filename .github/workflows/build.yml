# 通信概预算：macOS 构建（arm64 + x64）
#
# 触发方式（只用这两种，不在 push/PR 上跑 macOS runner）：
#   1. 推 tag：git push origin v1.0.1
#   2. 手动：Actions -> Build macOS -> Run workflow，填 tag（默认 v1.0.0）
#
# 产物：zip + dmg，自动上传到同名 Release（Release 不存在则新建）。

name: Build macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（须已存在）"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Test
        run: npm test

      - name: Build app
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: List artifacts
        run: ls -la dist-mac/

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "通信概预算 $TAG，见仓库 README"
          fi
          gh release upload "$TAG" dist-mac/*.zip dist-mac/*.dmg --clobber

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}-${{ github.event.inputs.tag || github.ref_name }}
          path: dist-mac/*
          if-no-files-found: error
