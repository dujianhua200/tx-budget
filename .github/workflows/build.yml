# 通信概预算：macOS 构建（只出 arm64 DMG，一个文件）
#
# 触发方式（只用这两种，不在 push/PR 上跑 macOS runner）：
#   1. 推 tag：git push origin v1.0.1
#   2. 手动：Actions -> Build macOS -> Run workflow，填 tag（默认 v1.0.0）
#
# 产物：arm64 DMG，自动上传到同名 Release（上传前只清该 Release 里的旧 .dmg，Windows 的 .exe 不动）。

name: Build macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（须已存在）"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build app
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: List artifacts
        run: ls -la dist-mac/

      - name: Verify package
        run: |
          set -e
          APP="dist-mac/mac-${{ matrix.arch }}/通信概预算.app"
          test -f "$APP/Contents/Resources/app.asar"
          codesign --verify --strict --verbose=2 "$APP"
          npx --yes asar list "$APP/Contents/Resources/app.asar" > /tmp/asar-list.txt
          grep -E "(^|/)dist/index.html$" /tmp/asar-list.txt
          grep -E "(^|/)node_modules/exceljs/dist/exceljs.js$" /tmp/asar-list.txt
          echo "包验证通过：含前端 + exceljs + 临时签名"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "通信概预算 $TAG，见仓库 README" || true
          fi
          # 只清旧 .dmg，不动 Windows 的 .exe
          for id in $(gh release view "$TAG" --json assets --jq '.assets[] | select(.name | endswith(".dmg")) | .id' 2>/dev/null || true); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done
          gh release upload "$TAG" dist-mac/*.dmg --clobber

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}-${{ github.event.inputs.tag || github.ref_name }}
          path: dist-mac/*
          if-no-files-found: error
